  <text x="150" y="68" font-family="Poppins, 'Trebuchet MS', Verdana, sans-serif" font-weight="700" font-size="52" letter-spacing="-0.5" fill="#3D0B37">Kréa<tspan fill="#63264A">Pro</tspan></text>
  <text x="152" y="90" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="10.5" letter-spacing="2.3" fill="#63264A">AGENCE WEB &amp; DESIGN — LA RÉUNION</text>
